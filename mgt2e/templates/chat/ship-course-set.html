<div class="mgt2e-chat-message initiative-box ship-initiative-box">
    <h2>{{actor.name}}</h2>
    <div class="mgt2e-chat-content">
        <table class="ship-initiative-table">
            <tr class="section-header"><th colspan="2">Set Course</th></tr>
            <tr>
                <th>Ordered by</th>
                <td>{{rollerName}}</td>
            </tr>
            <tr>
                <th>Orienting toward</th>
                <td>{{targetName}}</td>
            </tr>
            <tr>
                <th>Speed</th>
                <td>{{speed}}</td>
            </tr>
        </table>
    </div>
</div>
