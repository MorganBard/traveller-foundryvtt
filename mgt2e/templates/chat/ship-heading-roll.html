<div class="mgt2e-chat-message initiative-box ship-initiative-box">
    <h2>{{actor.name}}</h2>
    <div class="mgt2e-chat-content">
        <table class="ship-initiative-table">
            <tr class="section-header"><th colspan="2">Change Heading</th></tr>
            <tr>
                <th>Ordered by</th>
                <td>{{rollerName}}</td>
            </tr>
            <tr>
                <th>Heading</th>
                <td>Sector {{oldFacing}} &rarr; <strong>Sector {{newFacing}}</strong></td>
            </tr>
        </table>
    </div>
</div>
