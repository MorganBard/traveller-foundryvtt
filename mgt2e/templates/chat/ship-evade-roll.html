<div class="mgt2e-chat-message initiative-box ship-initiative-box">
    <h2>{{actor.name}}</h2>
    <div class="mgt2e-chat-content">
        <table class="ship-initiative-table">
            <tr class="section-header"><th colspan="2">Evasive Action</th></tr>
            <tr>
                <th>Pilot</th>
                <td>{{rollerName}}</td>
            </tr>
            <tr>
                <th>Dodge charges / Attack DM per dodge</th>
                <td>{{unspentThrust}} / {{numberFormat attackDM sign=true}}</td>
            </tr>
        </table>
    </div>
</div>
